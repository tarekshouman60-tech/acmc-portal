server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    location /api/ {
        proxy_pass http://backend:8000;
    }
    # Hashed build assets (filename changes every build) can be cached forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    # index.html must always be revalidated, otherwise browsers can keep
    # serving a stale HTML pointing at JS/CSS bundles a later build deleted.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
